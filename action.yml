name: Allyproof Check
description: Fails a pull request that adds WCAG 2.2 AA Findings, and shows them as code scanning alerts on the changed lines.
branding:
  icon: check-circle
  color: blue
inputs:
  base:
    description: The commit to compare with; only files changed since it are checked. Defaults to the pull request's base.
    default: ${{ github.event.pull_request.base.sha }}
  paths:
    description: Check these paths (space-separated) in full instead of the changed files.
    default: ''
  baseline:
    description: A baseline file; its Findings do not fail the job.
    default: ''
  fail-on:
    description: The lowest Finding severity that fails the job (error, warning or information).
    default: warning
  upload-sarif:
    description: Upload the results to GitHub code scanning (needs the security-events write permission).
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    # The command line from npm at this action's version. Built from the repository when a build is already there (this
    # repository's CI, so it checks its own code) or when that version is not published yet (a bump before its release)
    - name: Install the command line
      id: cli
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        version=$(node -p 'require("./package.json").version')
        if [ ! -f dist/cli.mjs ] && [ "$(npm view "allyproof@$version" version 2>/dev/null)" = "$version" ]; then
          npm install --prefix "$RUNNER_TEMP/allyproof" --ignore-scripts --no-audit --no-fund "allyproof@$version"
          echo "path=$RUNNER_TEMP/allyproof/node_modules/allyproof/cli.mjs" >> "$GITHUB_OUTPUT"
        else
          if [ ! -f dist/cli.mjs ]; then
            echo "::notice::allyproof@$version is not on npm; building it from the repository"
            npm ci --ignore-scripts --no-audit --no-fund && node esbuild.js --production
          fi
          echo "path=$PWD/dist/cli.mjs" >> "$GITHUB_OUTPUT"
        fi
    - name: Check
      id: check
      shell: bash
      env:
        CLI: ${{ steps.cli.outputs.path }}
        BASE: ${{ inputs.base }}
        PATHS: ${{ inputs.paths }}
        BASELINE: ${{ inputs.baseline }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(check --fail-on "$FAIL_ON")
        if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
        if [ -n "$PATHS" ]; then read -ra paths <<< "$PATHS"; args+=("${paths[@]}");
        elif [ -n "$BASE" ]; then args+=(--changed "$BASE"); fi
        set +e
        node "$CLI" "${args[@]}"
        code=$?
        node "$CLI" "${args[@]}" --format sarif > "$RUNNER_TEMP/allyproof.sarif"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Upload to code scanning
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ runner.temp }}/allyproof.sarif
        category: allyproof
    - name: Fail on blocking Findings or files that could not be checked
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.code }}
      run: |
        case "$CODE" in
          0) echo "No blocking Findings." ;;
          1) echo "::error::The pull request adds Findings that block; see the log above."; exit 1 ;;
          3) echo "::error::A file could not be checked; see the log above."; exit 3 ;;
          *) echo "::error::Allyproof could not run (exit $CODE)."; exit "$CODE" ;;
        esac
