name: Release

# Push a tag vX.Y.Z matching package.json. An odd minor publishes a pre-release, an even minor a stable release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pre-release: ${{ steps.version.outputs.pre-release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm
      - id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          minor=$(echo "$version" | cut -d. -f2)
          echo "pre-release=$([ $((minor % 2)) -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run audit
      - run: npm run verify
      - run: xvfb-run -a npm run test:extension-host
      # One universal VSIX (ADR 0003): no --target
      - run: npx vsce package ${{ steps.version.outputs.pre-release == 'true' && '--pre-release' || '' }} --out allyproof.vsix
      # The command line's npm package (#79), bundled again from the same commit
      - run: npm run package:npm && npm pack ./out/npm && mv allyproof-*.tgz allyproof-cli.tgz
      - uses: ./.github/actions/sbom
        with:
          path: allyproof.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            allyproof.vsix
            allyproof-cli.tgz
            allyproof.cdx.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Required reviewers on this environment hold the publish until approved
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # OIDC for registries
    env:
      # Set only for a pre-release
      PRE_RELEASE: ${{ needs.build.outputs.pre-release == 'true' && 'yes' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm
      # Only for the pinned vsce and ovsx; nothing is built here
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      # --skip-duplicate: a re-run after a later step failed does not fail on the version already published
      - run: npx vsce publish --oidc --skip-duplicate --packagePath allyproof.vsix ${PRE_RELEASE:+--pre-release}
      # The first publish creates the namespace's extension with a one-time token (OVSX_FIRST_PUBLISH_TOKEN on the
      # release environment). Delete the secret and the token afterwards: later publishes use trusted publishing.
      - env:
          OVSX_PAT: ${{ secrets.OVSX_FIRST_PUBLISH_TOKEN }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish allyproof.vsix --skip-duplicate -p "$OVSX_PAT" ${PRE_RELEASE:+--pre-release}
          else
            npx ovsx publish allyproof.vsix --skip-duplicate --trusted-publishing ${PRE_RELEASE:+--pre-release}
          fi
      # Trusted publishing (this workflow and environment, set on npmjs.com); skipped when the version is already there.
      # A pre-release goes to the next tag, so npx allyproof keeps installing the latest stable release
      - run: |
          version=${GITHUB_REF_NAME#v}
          if [ "$(npm view "allyproof@$version" version 2>/dev/null)" != "$version" ]; then
            npm publish allyproof-cli.tgz --provenance --access public --tag "$([ -n "$PRE_RELEASE" ] && echo next || echo latest)"
          fi
      # Official MCP Registry (#110) via GitHub OIDC; skipped when this version is already published
      - run: |
          version=${GITHUB_REF_NAME#v}
          if curl -fsS -o /dev/null "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.NotAisu%2Fallyproof/versions/$version"; then
            echo "io.github.NotAisu/allyproof@$version is already published to the MCP Registry"
            exit 0
          fi
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          ./mcp-publisher login github-oidc
          output=$(./mcp-publisher publish 2>&1) || {
            echo "$output"
            if echo "$output" | grep -qiE 'already exists|409|duplicate'; then
              echo "Version already published; skipping"
              exit 0
            fi
            exit 1
          }
          echo "$output"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v h="## $version" 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" allyproof.vsix allyproof-cli.tgz allyproof.cdx.json --title "$GITHUB_REF_NAME" \
            --notes-file notes.md ${{ needs.build.outputs.pre-release == 'true' && '--prerelease' || '' }}
