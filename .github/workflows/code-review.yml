name: Automated Code Review

on:
  pull_request:
    branches: ['main', 'develop']
    types: [opened, synchronize, reopened]

jobs:
  code-review:
    name: Code Review Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run linter
        run: npm run lint
        
      - name: Compile TypeScript
        run: npm run compile
        
      - name: Run tests
        run: npm run pretest
        continue-on-error: true
        
      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;
            
            // Get workflow run status
            const workflowRun = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: context.runId
            });
            
            const conclusion = workflowRun.data.conclusion;
            const status = workflowRun.data.status;
            
            let reviewBody;
            if (conclusion === 'success') {
              reviewBody = `✅ **Automated Code Review - PASSED**
              
              All checks have passed:
              - ✅ Linting passed
              - ✅ TypeScript compilation successful
              - ✅ Tests completed
              
              This PR meets the basic code quality requirements.`;
            } else {
              reviewBody = `❌ **Automated Code Review - ISSUES FOUND**
              
              Some checks failed. Please review the workflow logs and fix the issues:
              - 🔍 Check linting errors
              - 🔍 Check compilation errors  
              - 🔍 Check test failures
              
              Please address these issues before merging.`;
            }
            
            // Post review comment
            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: number,
              body: reviewBody,
              event: conclusion === 'success' ? 'APPROVE' : 'REQUEST_CHANGES'
            });