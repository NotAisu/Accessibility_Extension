name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint, typecheck, unit tests, bundle, then the gate: fails when Check precision or recall
      # of any WCAG criterion drops below the stored baseline of its language
      - run: npm run verify
