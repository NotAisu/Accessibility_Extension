name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The lowest supported runtime, the same as the esbuild target
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      # Shipped dependencies only: a high or critical advisory fails CI, unless scripts/audit.ts allows it until a date
      - run: npm run audit
      # Lint, typecheck, unit tests, then the gate on source and on the unpacked VSIX: fails when Check precision or recall
      # of any WCAG criterion drops below the stored baseline of its language, or when any score through the MCP server
      # of the unpacked npm package differs from the source's. Bundling also writes THIRD-PARTY-NOTICES
      # and fails on a bundled license outside the allowlist
      - run: npm run verify
      # Extension-host smoke tests: the packaged VSIX in the lowest supported VS Code, in a trusted and an untrusted
      # workspace, on a virtual display
      - run: xvfb-run -a npm run test:extension-host
      # The release SBOM step, so a broken SBOM fails here and not during a release
      - uses: ./.github/actions/sbom

  # The Allyproof Check action as a user's workflow runs it: it passes on files without Findings and fails on the
  # injection cases, each of which holds a Finding of a Proven rule
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pull request's own command line, so this checks the code under review and not the published package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund && node esbuild.js --production
      - uses: ./
        with:
          paths: src/cli
          upload-sarif: 'false'
      - id: failing
        continue-on-error: true
        uses: ./
        with:
          paths: test/ground-truth/injection/img-without-alt/primevue
          upload-sarif: 'false'
      - if: steps.failing.outcome != 'failure'
        run: echo "::error::The action passed on files with Findings"; exit 1
