<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCAG 2.2 AA Semantic Test Suite</title>
</head>

<body>
    <main>
        <h1>WCAG 2.2 AA Semantic Violations</h1>

        <img src="chart.png" alt="chart"> <!-- 1.1.1: Poor alt quality (describe meaning) -->
        <div>• Item</div> <!-- 1.3.1: List not marked up semantically (use ul/li) -->
        <p>Required fields are <span style="color: red">red</span></p> <!-- 1.4.1: Color conveys meaning alone -->
        <a href="/go">Click here</a> <!-- 2.4.4: Vague link text -->
        <h2>Information</h2> <!-- 2.4.6: Generic heading text -->
        <select onchange="location.href=this.value"></select> <!-- 3.2.2: Context change on input -->
        <input type="text" placeholder="Name"> <!-- 3.3.2: Input missing label -->
        <button aria-label="Upload file">Save</button> <!-- 2.5.3: Label-in-name mismatch -->
        <div onclick="submit()">Submit</div> <!-- 4.1.2: Interactive element without role/keyboard support -->
        <button></button> <!-- 4.1.2: Button without accessible name -->
        <button aria-describedby="nonexistent">Save</button> <!-- 4.1.2: aria-describedby references missing id -->
        <div role="button" aria-pressed="maybe">Toggle</div> <!-- 4.1.2: Invalid ARIA value -->
        <ul role="menu">
            <li>Item</li>
        </ul> <!-- 4.1.2: role=menu without proper menuitem children -->
        <div aria-hidden="true" tabindex="0">Hidden</div> <!-- 4.1.2: Focusable but aria-hidden -->
        <p>English text, then <span>cette partie est en français</span>.</p> <!-- 3.1.2: Language change not marked -->
        <button style="width: 12px; height: 12px;"></button> <!-- 2.5.8: Target size too small -->
        <a href="#" style="outline: none;">Link</a> <!-- 2.4.7: Focus visible removed -->
        <select></select> <!-- 4.1.2: Select without accessible name/label -->
        <input onfocus="location.href='/next'"> <!-- 3.2.1: On focus initiates unexpected change -->
        <iframe src="widget.html" title=""></iframe> <!-- 2.4.2: Iframe missing descriptive title -->
    </main>
</body>

</html>
