<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Accessible Clean Sample</title>
</head>

<body>
    <header role="banner">
        <h1>Accessible Sample</h1>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main id="home" role="main">
        <section aria-labelledby="intro-h">
            <h2 id="intro-h">Introduction</h2>
            <p>This file intentionally contains no known WCAG 2.2 AA violations for baseline false-positive checking.
            </p>
            <img src="logo.png" alt="Project logo" />
            <form aria-describedby="f-desc">
                <div>
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" />
                </div>
                <p id="f-desc">Enter a valid email to subscribe.</p>
                <button type="submit">Submit</button>
            </form>
        </section>
        <section aria-labelledby="data-h">
            <h2 id="data-h">Data</h2>
            <table>
                <caption>Sample Data</caption>
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Value</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Alpha</td>
                        <td>1</td>
                    </tr>
                    <tr>
                        <td>Beta</td>
                        <td>2</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer role="contentinfo">
        <p>&copy; 2025 Accessibility Test</p>
    </footer>
</body>

</html>
