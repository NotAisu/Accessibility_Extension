<!DOCTYPE html>
<html lang="en">
<head>
<title>Headers attribute specified on a cell refers to cells in the same table element passed example 6</title>
</head>
<body>
<table>
	<tr>
		<th id="name" colspan="2">Name</th>
	</tr>
	<tr>
		<th headers="name">Firstname</th>
		<th headers="name">Lastname</th>
	</tr>
</table>
</body>
</html>
