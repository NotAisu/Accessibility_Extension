<!DOCTYPE html>
<html lang="en">
<head>
<title>Headers attribute specified on a cell refers to cells in the same table element passed example 1</title>
</head>
<body>
<table>
	<thead>
		<tr>
			<th id="header1">Projects</th>
			<th id="header2">Objective</th>
		</tr>
	</thead>
	<tbody>
		<tr>
			<td headers="header1">15%</td>
			<td headers="header2">10%</td>
		</tr>
	</tbody>
</table>
</body>
</html>
