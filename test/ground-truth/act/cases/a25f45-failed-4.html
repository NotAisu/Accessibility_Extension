<!DOCTYPE html>
<html lang="en">
<head>
<title>Headers attribute specified on a cell refers to cells in the same table element failed example 4</title>
</head>
<body>
<table>
	<tr>
		<td>
			<span id="headerProject">Projects</span>
		</td>
		<td>
			<span id="headerObjective">Objective</span>
		</td>
	</tr>
	<tr>
		<td headers="headerProject">
			15%
		</td>
		<td headers="headerObjective">
			10%
		</td>
	</tr>
</table>
</body>
</html>
