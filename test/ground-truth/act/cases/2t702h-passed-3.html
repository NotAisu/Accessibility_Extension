<!DOCTYPE html>
<html lang="en">
<head>
<title>Summary element has non-empty accessible name passed example 3</title>
</head>
<body>
<span id="opening-times">Opening times</span>
<details>
	<summary aria-labelledby="opening-times"></summary>
	<p>This is a website. We are available 24/7.</p>
</details>
</body>
</html>
