<!DOCTYPE html>
<html lang="en">
<head>
<title>Headers attribute specified on a cell refers to cells in the same table element inapplicable example 1</title>
</head>
<body>
<table>
	<tr>
		<th scope="col">Projects</th>
		<th scope="col">Exams</th>
	</tr>
	<tr>
		<td>15%</td>
		<td>45%</td>
	</tr>
</table>
</body>
</html>
