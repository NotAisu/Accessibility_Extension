<!DOCTYPE html>
<html lang="en">
<head>
<title>Headers attribute specified on a cell refers to cells in the same table element passed example 5</title>
</head>
<body>
<table>
	<tbody>
		<tr>
			<th role="rowheader" id="headerAge">Age</th>
			<td headers="headerAge">65</td>
		</tr>
		<tr>
			<th role="rowheader" id="headerObjective">Objective</th>
			<td headers="headerObjective">40%</td>
		</tr>
	</tbody>
</table>
</body>
</html>
