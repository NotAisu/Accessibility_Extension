<!DOCTYPE html>
<html lang="en">
<head><title>Log in</title></head>
<body>
<main>
  <form>
    <label>Email <input type="email" autocomplete="username"></label>
    <label>Password <input type="password" autocomplete="off"></label>
    <label>Repeat <input type="password" autocomplete="current-password"></label>
    <button type="button" style="width: 16px; height: 16px" aria-label="Show password">*</button>
    <button type="submit" style="width: 96px; height: 32px">Log in</button>
  </form>
</main>
</body>
</html>
