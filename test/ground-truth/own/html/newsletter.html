<!DOCTYPE html>
<html lang="en">
<head><title>Newsletter</title></head>
<body>
<main>
  <form>
    <p style="color: #999999">We send one email a month.</p>
    <p style="color: #767676">Unsubscribe at any time.</p>
    <label>Email <input type="email" autocomplete="email" style="border: 1px solid #dddddd"></label>
    <label>Name <input type="text" autocomplete="name" style="border: 1px solid #767676"></label>
    <p style="color: var(--muted)">Read our privacy policy.</p>
    <button type="submit">Subscribe</button>
  </form>
</main>
</body>
</html>
