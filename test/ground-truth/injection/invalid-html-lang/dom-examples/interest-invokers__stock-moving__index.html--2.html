<!DOCTYPE html>
<html lang="invalid-lang-xyz">
  <head>
    <meta charset="utf-8" />
    <title>interestfor stock moving example</title>

    <link href="styles.css" rel="stylesheet" />
    <script defer src="index.js"></script>
  </head>
  <body>
    <h1>interestfor stock moving example</h1>
    <div class="wrapper">
      <p id="button-tooltip" popover="auto"></p>
      <section>
        <h2>Stock to keep</h2>
        <div class="keep">
          <button
            data-stock="9"
            data-product="🥕 Carrots"
            interestfor="button-tooltip"
          >
            🥕 Carrots (9)
          </button>
          <button
            data-stock="50"
            data-product="🫛 Peas"
            interestfor="button-tooltip"
          >
            🫛 Peas (50)
          </button>
          <button
            data-stock="20"
            data-product="🥔 Potatoes"
            interestfor="button-tooltip"
          >
            🥔 Potatoes (20)
          </button>
          <button
            data-stock="12"
            data-product="🌶️ Peppers"
            interestfor="button-tooltip"
          >
            🌶️ Peppers (12)
          </button>
          <button
            data-stock="15"
            data-product="🍅 Tomatoes"
            interestfor="button-tooltip"
          >
            🍅 Tomatoes (15)
          </button>
        </div>
      </section>
      <section>
        <h2>Stock to sell</h2>
        <div class="sell"></div>
      </section>
    </div>
  </body>
</html>
