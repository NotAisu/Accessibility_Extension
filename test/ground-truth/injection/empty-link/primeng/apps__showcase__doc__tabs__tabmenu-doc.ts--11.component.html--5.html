
        <app-docsectiontext>
            <p>
                A navigation menu is implemented using tabs without the panels where the content of a tab is provided by a route component like
                <a href="https://angular.dev/api/router/RouterOutlet?tab=description" target="_blank" rel="noopener noreferrer"></a>. For the purpose of this demo, <i>router-outlet</i> is not included.
            </p>
        </app-docsectiontext>
        <div class="card">
            <p-tabs value="dashboard">
                <p-tablist>
                    @for (tab of tabs; track tab.route) {
                        <p-tab [value]="tab.route" class="flex items-center !gap-2 text-inherit">
                            <i [class]="tab.icon"></i>
                            <span>{{ tab.label }}</span>
                        </p-tab>
                    }
                </p-tablist>
            </p-tabs>
            <!--<router-outlet></router-outlet>-->
        </div>
