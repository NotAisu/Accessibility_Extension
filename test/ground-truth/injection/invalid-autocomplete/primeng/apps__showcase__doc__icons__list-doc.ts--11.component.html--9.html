
        <app-docsectiontext>
            <p>
                Here is the full list of PrimeIcons. More icons will be added periodically and you may also
                <a href="https://github.com/primefaces/primeicons/issues">request new icons</a> at the issue tracker.
            </p>
        </app-docsectiontext>
        <div>
            <input autocomplete="emal" class="p-inputtext p-component w-full p-4 mt-4 mb-6" (input)="onFilter($event)" pInputText placeholder="Search an icon" />
        </div>
        <div class="card">
            <div class="grid grid-cols-12 gap-4 text-center">
                <div class="col-span-12 md:col-span-2 mb-8" *ngFor="let icon of filteredIcons">
                    <i class="pi pi-{{ icon.properties.name }} text-2xl mb-4 text-muted-color"></i>
                    <div>pi-{{ icon.properties.name }}</div>
                </div>
            </div>
        </div>
